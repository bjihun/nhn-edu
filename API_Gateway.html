<style>
/* Layout: sticky toolbar (search, hide-answers, section chips) over one reading column of term→answer rows, grouped by exam domain */
:root {
  --bg: #f6f8fa;
  --surface: #ffffff;
  --fg: #17212b;
  --muted: #5b6875;
  --line: #dde3e9;
  --accent: #1d5f8a;
  --accent-soft: #e3eef6;
  --warn: #9a5b00;
  --warn-soft: #fdf1dc;
  --mask: #d5dde4;
  --font-body: "IBM Plex Sans KR", "Malgun Gothic", "Apple SD Gothic Neo", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", Consolas, "D2Coding", monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #11171d; --surface: #182129; --fg: #e3e9ef; --muted: #98a6b3; --line: #2a3640;
    --accent: #7db8e0; --accent-soft: #1d3446; --warn: #f0b860; --warn-soft: #3a2c14; --mask: #2c3943;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #11171d; --surface: #182129; --fg: #e3e9ef; --muted: #98a6b3; --line: #2a3640;
  --accent: #7db8e0; --accent-soft: #1d3446; --warn: #f0b860; --warn-soft: #3a2c14; --mask: #2c3943;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 15px; line-height: 1.6; }
.wrap { max-width: 980px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
header.top { padding-block: 28px 8px; }
header.top h1 { font-size: 26px; margin: 0 0 4px; text-wrap: balance; letter-spacing: -0.01em; }
header.top p { margin: 0; color: var(--muted); }
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line); }
.bar .wrap { padding-block: 10px; display: flex; flex-direction: column; gap: 8px; }
.controls { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
#q { flex: 1 1 220px; min-width: 0; font: inherit; padding: 8px 12px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); color: var(--fg); }
#q:focus-visible, button:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button { font: inherit; font-size: 14px; padding: 7px 12px; border-radius: 6px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); cursor: pointer; }
button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--surface); }
#count { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
.chips { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: thin; }
.chips a { flex: none; font-size: 13px; text-decoration: none; color: var(--accent); background: var(--accent-soft); padding: 3px 10px; border-radius: 999px; white-space: nowrap; }
main { padding-block: 16px 64px; display: flex; flex-direction: column; gap: 36px; }
section h2 { font-size: 20px; margin: 0 0 4px; display: flex; align-items: baseline; gap: 10px; scroll-margin-top: 120px; }
section h2 small { font-size: 13px; font-weight: 400; color: var(--muted); font-variant-numeric: tabular-nums; }
section > .lead { margin: 0 0 12px; color: var(--muted); font-size: 14px; }
h3 { font-size: 13px; letter-spacing: 0.06em; color: var(--accent); margin: 18px 0 6px; font-weight: 700; }
dl { margin: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; }
.row { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 3fr); gap: 4px 20px; padding: 10px 14px; border-top: 1px solid var(--line); }
.row:first-child { border-top: 0; }
dt { font-weight: 500; min-width: 0; }
dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
dd b { color: var(--accent); }
code { font-family: var(--font-mono); font-size: 13px; background: var(--accent-soft); padding: 1px 5px; border-radius: 4px; overflow-wrap: anywhere; }
.note { display: inline-block; margin-top: 4px; font-size: 13px; color: var(--warn); background: var(--warn-soft); padding: 1px 8px; border-radius: 4px; }
.tag { font-size: 12px; color: var(--muted); border: 1px solid var(--line); border-radius: 4px; padding: 0 6px; margin-left: 6px; white-space: nowrap; font-weight: 400; }
table { border-collapse: collapse; width: 100%; font-size: 14px; background: var(--surface); }
.tbl { overflow-x: auto; border: 1px solid var(--line); border-radius: 8px; }
th, td { text-align: left; padding: 8px 12px; border-top: 1px solid var(--line); vertical-align: top; }
thead th { border-top: 0; font-size: 12px; letter-spacing: 0.05em; color: var(--muted); font-weight: 500; }
td.num { font-variant-numeric: tabular-nums; white-space: nowrap; font-weight: 500; }
.hide dd:not(.shown), .hide td.ans:not(.shown) { cursor: pointer; background: var(--mask); color: transparent; border-radius: 4px; user-select: none; }
.hide dd:not(.shown) *, .hide td.ans:not(.shown) * { color: transparent !important; background: transparent !important; }
mark { background: #ffe58a; color: #17212b; border-radius: 2px; }
.empty { color: var(--muted); padding: 24px 0; }
@media (max-width: 640px) {
  .row { grid-template-columns: 1fr; }
  header.top h1 { font-size: 22px; }
}
@media (prefers-reduced-motion: no-preference) { html { scroll-behavior: smooth; } }
</style>

<header class="top">
  <div class="wrap">
    <h1>API Gateway 요점정리</h1>
    <p>NHN Cloud CAA 시험의 API Gateway 영역만 따로 모았습니다. 기능별로 묶고 중복은 합쳤습니다. 「가리기」를 켜면 답이 가려지고, 누르면 하나씩 보입니다.</p>
  </div>
</header>

<div class="bar">
  <div class="wrap">

<main class="wrap" id="main"></main>

  ["API 설명서 외부 공개", "<b>최초 스테이지 배포 이후</b> 게시, 처음 상태는 <b>비공개</b>"]
 ]},
 { name: "플러그인", items: [
  ["플러그인 추가 후", "<b>변경 사항 저장</b> 버튼을 눌러야 설정이 저장됨"],

 ]},

// 단일 서비스 파일: 묶음마다 별도 영역으로 펼쳐 바로가기 칩을 만든다
const SEC = S.pop();
for (const g of SEC.groups) S.push({ id: "g" + S.length, title: g.name, groups: [{ items: g.items }] });

const main = document.getElementById("main");
const chips = document.getElementById("chips");

function rowHTML(it) {
  return `<div class="row"><dt>${it[0]}</dt><dd>${it[1]}</dd></div>`;
}
function render() {
  let html = "";
  for (const s of S) {
    const n = s.table ? s.table.length : s.groups.reduce((a, g) => a + g.items.length, 0);
    html += `<section id="${s.id}" data-sec><h2>${s.title}<small>${n}개</small></h2>`;
    if (s.lead) html += `<p class="lead">${s.lead}</p>`;
    if (s.table) {
      html += `<div class="tbl"><table><thead><tr><th>항목</th><th>값</th></tr></thead><tbody>` +
        s.table.map(r => `<tr class="row-t"><td>${r[0]}</td><td class="num ans">${r[1]}</td></tr>`).join("") +
        `</tbody></table></div>`;
    } else {
      for (const g of s.groups) {
        html += `<div data-grp>${g.name ? `<h3>${g.name}</h3>` : ""}<dl>${g.items.map(rowHTML).join("")}</dl></div>`;
      }
    }
    html += `</section>`;
    chips.insertAdjacentHTML("beforeend", `<a href="#${s.id}">${s.title}</a>`);
  }
  main.innerHTML = html + `<p class="empty" id="empty" hidden>검색 결과가 없습니다. 다른 단어로 찾아보세요.</p>`;
  for (const el of main.querySelectorAll(".row, .row-t")) el.dataset.text = el.textContent.toLowerCase();
}
render();

const q = document.getElementById("q");
const count = document.getElementById("count");
const total = main.querySelectorAll(".row, .row-t").length;
function filter() {
  const t = q.value.trim().toLowerCase();
  let shown = 0;
  for (const r of main.querySelectorAll(".row, .row-t")) {
    const ok = !t || r.dataset.text.includes(t);
    r.hidden = !ok; if (ok) shown++;
  }
  for (const g of main.querySelectorAll("[data-grp]")) g.hidden = !g.querySelector(".row:not([hidden])");
  for (const s of main.querySelectorAll("[data-sec]")) s.hidden = !s.querySelector(".row:not([hidden]), .row-t:not([hidden])");
  document.getElementById("empty").hidden = shown > 0;
  count.textContent = t ? `${shown} / ${total}개` : `전체 ${total}개`;
}
q.addEventListener("input", filter);
filter();

const hideBtn = document.getElementById("hideBtn");
function setHide(on) {
  document.body.classList.toggle("hide", on);
  hideBtn.setAttribute("aria-pressed", String(on));
  for (const d of main.querySelectorAll(".shown")) d.classList.remove("shown");
  try { localStorage.setItem("apigw-hide", on ? "1" : "0"); } catch (e) {}
}
hideBtn.addEventListener("click", () => setHide(!document.body.classList.contains("hide")));
document.getElementById("revealBtn").addEventListener("click", () => {
  for (const d of main.querySelectorAll("dd, td.ans")) d.classList.add("shown");
});
main.addEventListener("click", e => {
  const d = e.target.closest("dd, td.ans");
  if (d && document.body.classList.contains("hide")) d.classList.toggle("shown");
});
try { if (localStorage.getItem("apigw-hide") === "1") setHide(true); } catch (e) {}
</script>
