/* Layout: one centered work column; home = mode list, quiz = question card with option rows, exam adds a sticky timer bar and number grid */

* { box-sizing: border-box; }

<script>
const DATA = JSON.parse(document.getElementById("qdata").textContent);

const EXAM_N = 60, EXAM_MIN = 120, PASS = 700;
const KEY = "nhn-assoc-scenario-v1";

let store = { stats: {}, wrong: [] };
try { const s = JSON.parse(localStorage.getItem(KEY) || "null"); if (s && s.stats) store = s; } catch (e) {}
function save() { try { localStorage.setItem(KEY, JSON.stringify(store)); } catch (e) {} }

const app = document.getElementById("app");
const examBar = document.getElementById("examBar");
document.getElementById("subTitle").textContent = `상황 설명형 ${QS.length.toLocaleString()}문항 · 단일/복수 선택`;
document.getElementById("homeLink").addEventListener("click", () => { if (!session || session.mode !== "exam" || session.done) home(); });

function el(tag, attrs = {}, ...kids) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "class") n.className = v;
    else if (k.startsWith("on")) n.addEventListener(k.slice(2), v);
    else if (v !== false && v != null) n.setAttribute(k, v === true ? "" : v);
  }
  for (const c of kids.flat()) if (c != null) n.append(c.nodeType ? c : document.createTextNode(c));
  return n;
}
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function same(a, b) { return a.length === b.length && a.slice().sort().join() === b.slice().sort().join(); }
function record(q, ok) {
  const s = store.stats[q.id] || [0, 0];
  s[0]++; if (ok) s[1]++;
  store.stats[q.id] = s;
  const w = new Set(store.wrong);
  ok ? w.delete(q.id) : w.add(q.id);
  store.wrong = [...w];
  save();
}

let session = null, timerId = null;

/* ------------------------------------------------------------ 홈 */
function home() {
  session = null; clearInterval(timerId); examBar.replaceChildren();
  const tried = Object.keys(store.stats).length;
  let tries = 0, right = 0;
  for (const [t, r] of Object.values(store.stats)) { tries += t; right += r; }
  const rate = tries ? Math.round(right / tries * 100) + "%" : "–";

  const domSel = el("select", { id: "domSel", "aria-label": "연습할 영역" },
    Object.entries(DOM).map(([k, v]) => el("option", { value: k }, `${v} (${QS.filter(q => q.d == k).length})`)));
  const cntSel = el("select", { id: "cntSel", "aria-label": "문항 수" },
    [10, 20, 50, 0].map(n => el("option", { value: n }, n ? `${n}문항` : "전체")));
  const rndSel = el("select", { id: "rndSel", "aria-label": "랜덤 문항 수" },
    [20, 50, 100].map(n => el("option", { value: n }, `${n}문항`)));
  const SC = QS.filter(q => q.k === "SH");
  const scDomSel = el("select", { id: "scDomSel", "aria-label": "서술형 영역" }, el("option", { value: "" }, `전체 영역 (${SC.length})`),
    Object.entries(DOM).map(([k, v]) => el("option", { value: k }, `${v} (${SC.filter(q => q.d == k).length})`)));
  const scCntSel = el("select", { id: "scCntSel", "aria-label": "서술형 문항 수" },
    [10, 20, 50, 0].map(n => el("option", { value: n }, n ? `${n}문항` : "전체")));

  const domainRows = Object.entries(DOM).map(([k, v]) => {
    const ids = QS.filter(q => q.d == k).map(q => q.id);
    const done = ids.filter(id => store.stats[id]).length;
    return el("div", { class: "drow" },
      el("span", {}, `${v} `, el("span", { class: "muted small" }, `출제 ${W[k]}%`)),
      el("span", { class: "num small" }, `${done}/${ids.length}`),
      el("div", { class: "bar" }, el("i", { style: `width:${ids.length ? done / ids.length * 100 : 0}%` })));
  });

  app.replaceChildren(
    el("div", { class: "stats" },
      el("div", { class: "stat" }, el("b", {}, `${tried}`), el("span", { class: "muted small" }, `푼 문항 / ${QS.length}`)),
      el("div", { class: "stat" }, el("b", {}, rate), el("span", { class: "muted small" }, "누적 정답률")),
      el("div", { class: "stat" }, el("b", {}, `${store.wrong.length}`), el("span", { class: "muted small" }, "오답 노트"))),
    el("div", { class: "modes" },
      el("div", { class: "mode" },
        el("div", { class: "txt" }, el("b", {}, "모의고사"), el("span", { class: "muted small" }, `실제 시험처럼 ${EXAM_N}문항 · ${EXAM_MIN}분 · ${PASS}점 이상 합격. 도메인 출제 비율대로 뽑습니다.`)),
        el("div", { class: "ctl" }, el("button", { class: "primary", onclick: startExam }, "시작"))),
      el("div", { class: "mode" },
        el("div", { class: "txt" }, el("b", {}, "영역별 연습"), el("span", { class: "muted small" }, "한 문제씩 풀고 바로 정답과 근거를 확인합니다.")),
        el("div", { class: "ctl" }, domSel, cntSel, el("button", { class: "primary", onclick: () => {
          const d = +domSel.value, n = +cntSel.value;
          const pool = shuffle(QS.filter(q => q.d === d).map(q => q.id));
          startPractice(n ? pool.slice(0, n) : pool, DOM[d]);
        } }, "시작"))),
      el("div", { class: "mode" },
        el("div", { class: "txt" }, el("b", {}, "직접 작성 문항 연습"), el("span", { class: "muted small" }, "상황을 하나하나 직접 쓴 문항만 골라 풉니다. 조합형 문항은 빠집니다.")),
        el("div", { class: "ctl" }, scDomSel, scCntSel, el("button", { class: "primary", onclick: () => {
          const d = scDomSel.value, n = +scCntSel.value;
          const pool = shuffle(SC.filter(q => !d || q.d == d).map(q => q.id));
          startPractice(n ? pool.slice(0, n) : pool, "직접 작성 문항");
        } }, "시작"))),
      el("div", { class: "mode" },
        el("div", { class: "txt" }, el("b", {}, "랜덤 연습"), el("span", { class: "muted small" }, "전체 문제은행에서 무작위로 섞어 풉니다.")),
        el("div", { class: "ctl" }, rndSel, el("button", { class: "primary", onclick: () => startPractice(shuffle(QS.map(q => q.id)).slice(0, +rndSel.value), "랜덤 연습") }, "시작"))),
      el("div", { class: "mode" },
        el("div", { class: "txt" }, el("b", {}, "오답 노트"), el("span", { class: "muted small" }, "틀린 문제만 다시 풉니다. 맞히면 노트에서 빠집니다.")),
        el("div", { class: "ctl" }, el("button", { class: "primary", disabled: !store.wrong.length, onclick: () => startPractice(shuffle(store.wrong), "오답 노트") }, `${store.wrong.length}문항 풀기`))),
      el("div", { class: "mode" },
        el("div", { class: "txt" }, el("b", {}, "문제 목록"), el("span", { class: "muted small" }, `${QS.length.toLocaleString()}문항을 검색하고 정답·근거를 훑어봅니다.`)),
        el("div", { class: "ctl" }, el("button", { onclick: () => browse() }, "열기")))),
    el("section", { class: "card" }, el("h2", {}, "영역별 진도"), el("div", { class: "domains" }, domainRows)),
    el("p", { class: "note" }, "출처: NHN Cloud Certified Cloud Architect - Associate 시험 안내서, 샘플 문항(사실만 확인해 문장은 새로 작성), NHN Cloud 사용자 가이드 서비스 개요, 정리하신 요점정리. 모든 문항은 고객사 상황을 설명하는 서술형입니다. 절반은 요점정리 사실을 바탕으로 상황과 보기를 직접 썼고, 나머지 절반은 영역별 상황 설명에 요점정리 사실 문장과 수치를 바꾼 오답을 엮은 조합형이라 공식 문제와 표현이 다를 수 있습니다. 진도와 오답 노트는 이 브라우저에만 저장됩니다.",
      " ", el("button", { class: "small", onclick: e => { if (e.target.dataset.arm) { store = { stats: {}, wrong: [] }; save(); home(); } else { e.target.dataset.arm = "1"; e.target.textContent = "한 번 더 누르면 초기화"; } } }, "기록 초기화"))
  );
  window.scrollTo(0, 0);
}

/* ------------------------------------------------------------ 연습 */
function startPractice(ids, label) {
  if (!ids.length) return;
  session = { mode: "practice", label, ids, i: 0, sel: {}, checked: {}, right: 0 };
  renderQ();
}

/* ------------------------------------------------------------ 모의고사 */
function startExam() {
  const total = Object.values(W).reduce((a, b) => a + b, 0);
  let ids = [];
  const keys = Object.keys(DOM);
  keys.forEach(k => {
    const n = Math.round(EXAM_N * W[k] / total);
    ids.push(...shuffle(QS.filter(q => q.d == k).map(q => q.id)).slice(0, n));
  });
  ids = ids.slice(0, EXAM_N);
  session = { mode: "exam", label: "모의고사", ids, i: 0, sel: {}, done: false, endAt: Date.now() + EXAM_MIN * 60000, confirm: false };
  clearInterval(timerId);
  timerId = setInterval(tick, 1000);
  renderQ();
}
function tick() {
  if (!session || session.mode !== "exam" || session.done) return clearInterval(timerId);
  const left = Math.max(0, session.endAt - Date.now());
  const t = document.getElementById("timer");
  if (t) {
    const m = Math.floor(left / 60000), s = Math.floor(left % 60000 / 1000);
    t.textContent = `${String(m).padStart(2, "0")}:${String(s).padStart(2, "0")}`;
    t.classList.toggle("low", left < 10 * 60000);
  }
  if (!left) finishExam();
}
function renderExamBar() {
  const answered = session.ids.filter(id => (session.sel[id] || []).length).length;
  examBar.replaceChildren(el("div", { class: "examhead" }, el("div", { class: "wrap" },
    el("span", {}, el("b", {}, "모의고사 "), el("span", { class: "muted small" }, `답한 문항 ${answered}/${session.ids.length}`)),
    el("span", { class: "timer", id: "timer", "aria-label": "남은 시간" }, "--:--"),
    el("button", { onclick: () => { session.confirm = true; renderQ(); } }, "제출"))));
  tick();
}
function finishExam() {
  clearInterval(timerId);
  session.done = true;
  examBar.replaceChildren();
  let right = 0; const per = {};
  for (const id of session.ids) {
    const q = byId.get(id), ok = same(session.sel[id] || [], q.a);
    if (ok) right++;
    per[q.d] = per[q.d] || [0, 0]; per[q.d][0]++; if (ok) per[q.d][1]++;
    record(q, ok);
  }
  const score = Math.round(right / session.ids.length * 1000);
  const wrongIds = session.ids.filter(id => !same(session.sel[id] || [], byId.get(id).a));
  app.replaceChildren(
    el("section", { class: "card" },
      el("h2", {}, "모의고사 결과"),
      el("div", { class: "score" }, el("b", {}, `${score}`), el("span", { class: "muted" }, "/ 1,000점"),
        el("span", { class: score >= PASS ? "pass" : "fail" }, score >= PASS ? "합격 기준 통과" : `불합격 (기준 ${PASS}점)`)),
      el("span", { class: "muted small" }, `${session.ids.length}문항 중 ${right}문항 정답`),
      el("div", { class: "domains" }, Object.entries(per).map(([d, [n, r]]) => el("div", { class: "drow" },
        el("span", {}, DOM[d]), el("span", { class: "num small" }, `${r}/${n}`),
        el("div", { class: "bar" }, el("i", { style: `width:${r / n * 100}%` }))))),
      el("div", { class: "actions" },
        el("button", { onclick: home }, "처음으로"),
        el("button", { class: "primary", disabled: !wrongIds.length, onclick: () => startPractice(wrongIds, "모의고사 오답") }, `틀린 ${wrongIds.length}문항 다시 풀기`))),
    el("h2", {}, "문항별 확인"),
    el("div", { class: "list" }, session.ids.map((id, n) => reviewCard(byId.get(id), session.sel[id] || [], n + 1)))
  );
  window.scrollTo(0, 0);
}

/* ------------------------------------------------------------ 문항 화면 */
function optButton(q, idx, chosen, reveal) {
  const isMulti = q.t === "multi";
  let cls = "opt" + (isMulti ? " multi" : "");
  if (reveal) {
    if (q.a.includes(idx)) cls += " right";
    else if (chosen.includes(idx)) cls += " wrong";
  } else if (chosen.includes(idx)) cls += " sel";
  return el("button", { class: cls, "aria-pressed": chosen.includes(idx) ? "true" : "false", disabled: reveal && session && session.mode !== "browse" ? true : null,
    onclick: () => choose(q, idx) }, el("span", { class: "k" }, String(idx + 1)), el("span", {}, q.o[idx]));
}
function metaRow(q, n, total) {
  return el("div", { class: "meta" },
    n ? el("span", { class: "chip gray" }, `${n}${total ? " / " + total : ""}`) : null,
    el("span", { class: "chip" }, DOM[q.d]),
    q.t === "multi" ? el("span", { class: "chip multi" }, `복수 선택 · ${q.a.length}개`) : el("span", { class: "chip gray" }, "단일 선택"),
    el("span", { class: "chip gray" }, q.s),
    el("span", { class: "chip gray" }, `#${q.id}`));
}
function choose(q, idx) {
  const s = session;
  if (s.mode === "practice" && s.checked[q.id]) return;
  let cur = s.sel[q.id] || [];
  if (q.t === "multi") cur = cur.includes(idx) ? cur.filter(x => x !== idx) : [...cur, idx];
  else cur = [idx];
  s.sel[q.id] = cur;
  renderQ();
}
function renderQ() {
  const s = session, id = s.ids[s.i], q = byId.get(id), chosen = s.sel[id] || [];
  const checked = s.mode === "practice" && s.checked[id];
  if (s.mode === "exam") renderExamBar(); else examBar.replaceChildren();

  const parts = [metaRow(q, s.i + 1, s.ids.length), el("p", { class: "qtext" }, q.q),
    el("div", { class: "opts" }, q.o.map((_, i) => optButton(q, i, chosen, checked)))];

  if (checked) {
    const ok = same(chosen, q.a);
    parts.push(el("div", { class: "feedback " + (ok ? "ok" : "bad") },
      el("b", {}, ok ? "정답입니다" : `오답입니다 · 정답 ${q.a.map(a => a + 1).join(", ")}번`), q.e));
  }

  const last = s.i === s.ids.length - 1;
  const actions = el("div", { class: "actions" });
  if (s.mode === "practice") {
    actions.append(
      el("button", { onclick: home }, "그만하기"),
      el("span", { class: "muted small" }, `${s.label} · 맞힌 문항 ${s.right}`),
      !checked
        ? el("button", { class: "primary", disabled: !chosen.length || (q.t === "multi" && chosen.length !== q.a.length) ? true : null, onclick: () => {
            s.checked[id] = true; const ok = same(chosen, q.a); if (ok) s.right++; record(q, ok); renderQ();
          } }, q.t === "multi" && chosen.length !== q.a.length ? `${q.a.length}개를 고르세요` : "정답 확인")
        : el("button", { class: "primary", onclick: () => { if (last) practiceDone(); else { s.i++; renderQ(); window.scrollTo(0, 0); } } }, last ? "결과 보기" : "다음 문제"));
  } else {
    actions.append(
      el("button", { disabled: s.i === 0 ? true : null, onclick: () => { s.i--; s.confirm = false; renderQ(); } }, "이전"),
      el("button", { class: "primary", onclick: () => { if (last) { s.confirm = true; } else { s.i++; s.confirm = false; } renderQ(); } }, last ? "제출하기" : "다음"));
  }
  parts.push(actions);

  const out = [el("section", { class: "card" }, parts)];
  if (s.mode === "exam") {
    if (s.confirm) {
      const left = s.ids.filter(x => !(s.sel[x] || []).length).length;
      out.unshift(el("div", { class: "confirm" },
        el("span", {}, left ? `답하지 않은 문항이 ${left}개 있습니다. 제출할까요?` : "모든 문항에 답했습니다. 제출할까요?"),
        el("span", { class: "ctl" }, el("button", { onclick: () => { s.confirm = false; renderQ(); } }, "계속 풀기"), " ",
          el("button", { class: "primary", onclick: finishExam }, "제출"))));
    }
    out.push(el("section", { class: "card" }, el("span", { class: "muted small" }, "문항 이동"),
      el("div", { class: "grid" }, s.ids.map((x, n) => el("button", {
        class: ((s.sel[x] || []).length ? "done" : "") + (n === s.i ? " cur" : ""), "aria-label": `${n + 1}번 문항`,
        onclick: () => { s.i = n; s.confirm = false; renderQ(); } }, String(n + 1))))));
  }
  app.replaceChildren(...out);
}
function practiceDone() {
  const s = session;
  const wrongIds = s.ids.filter(id => !same(s.sel[id] || [], byId.get(id).a));
  app.replaceChildren(el("section", { class: "card" },
    el("h2", {}, `${s.label} 완료`),
    el("div", { class: "score" }, el("b", {}, `${s.right}`), el("span", { class: "muted" }, `/ ${s.ids.length}문항 정답`)),
    el("div", { class: "actions" },
      el("button", { onclick: home }, "처음으로"),
      el("button", { class: "primary", disabled: !wrongIds.length, onclick: () => startPractice(wrongIds, `${s.label} 오답`) }, `틀린 ${wrongIds.length}문항 다시 풀기`))));
}

/* ------------------------------------------------------------ 문제 목록 */
function reviewCard(q, chosen, n) {
  const ok = chosen ? same(chosen, q.a) : null;
  return el("section", { class: "card" }, metaRow(q, n), el("p", { class: "qtext" }, q.q),
    el("div", { class: "opts" }, q.o.map((_, i) => {
      let cls = "opt" + (q.t === "multi" ? " multi" : "");
      if (q.a.includes(i)) cls += " right"; else if (chosen && chosen.includes(i)) cls += " wrong";
      return el("div", { class: cls }, el("span", { class: "k" }, String(i + 1)), el("span", {}, q.o[i]));
    })),
    el("div", { class: "feedback " + (ok === false ? "bad" : "ok") }, ok === false ? el("b", {}, chosen.length ? "오답" : "미응답") : null, q.e));
}
function browse() {
  session = { mode: "browse" }; clearInterval(timerId); examBar.replaceChildren();
  const input = el("input", { type: "search", id: "bq", placeholder: "검색 (예: 스테이지, 429, Service Gateway)", "aria-label": "문제 검색" });
  const dsel = el("select", { id: "bd", "aria-label": "영역" }, el("option", { value: "" }, "전체 영역"),
    Object.entries(DOM).map(([k, v]) => el("option", { value: k }, v)));
  const tsel = el("select", { id: "bt", "aria-label": "문항 유형" }, el("option", { value: "" }, "전체 유형"),
    el("option", { value: "sc" }, "직접 작성 문항만"), el("option", { value: "short" }, "조합형 문항만"));
  const list = el("div", { class: "list" });
  const info = el("span", { class: "muted small" });
  let limit = 30;
  const more = el("button", { onclick: () => { limit += 30; draw(); } }, "더 보기");
  function draw() {
    const t = input.value.trim().toLowerCase(), d = dsel.value, ty = tsel.value;
    const hits = QS.filter(q => (!d || q.d == d) && (!ty || (ty === "sc") === (q.k === "SH")) && (!t || (q.q + " " + q.o.join(" ") + " " + q.e).toLowerCase().includes(t)));
    info.textContent = `${hits.length}문항`;
    list.replaceChildren(...hits.slice(0, limit).map(q => reviewCard(q, null)));
    more.hidden = hits.length <= limit;
  }
  input.addEventListener("input", () => { limit = 30; draw(); });
  dsel.addEventListener("change", () => { limit = 30; draw(); });
  tsel.addEventListener("change", () => { limit = 30; draw(); });
  app.replaceChildren(
    el("div", { class: "actions" }, el("button", { onclick: home }, "처음으로"), info),
    el("div", { class: "browse-ctl" }, input, dsel, tsel), list, more);
  draw();
}

/* 키보드: 1~5 보기 선택, Enter 확인/다음 */
document.addEventListener("keydown", e => {
  if (!session || session.mode === "browse" || session.done || e.target.matches("input, select, textarea")) return;
  if (!session.ids) return;
  const q = byId.get(session.ids[session.i]);
  if (/^[1-9]$/.test(e.key) && +e.key <= q.o.length) { choose(q, +e.key - 1); }
  else if (e.key === "Enter") { const b = app.querySelector(".actions button.primary:not([disabled])"); if (b) { e.preventDefault(); b.click(); } }
});

home();
</script>
