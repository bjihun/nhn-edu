const main = document.getElementById("main");
const chips = document.getElementById("chips");

function rowHTML(it) {
  return `<div class="row"><dt>${it[0]}</dt><dd>${it[1]}</dd></div>`;
}
function render() {
  let html = "";
  for (const s of S) {
    const n = s.table ? s.table.length : s.groups.reduce((a, g) => a + g.items.length, 0);
    html += `<section id="${s.id}" data-sec><h2>${s.title}<small>${n}개</small></h2>`;
    if (s.lead) html += `<p class="lead">${s.lead}</p>`;
    if (s.table) {
      html += `<div class="tbl"><table><thead><tr><th>항목</th><th>값</th></tr></thead><tbody>` +
        s.table.map(r => `<tr class="row-t"><td>${r[0]}</td><td class="num ans">${r[1]}</td></tr>`).join("") +
        `</tbody></table></div>`;
    } else {
      for (const g of s.groups) {
        html += `<div data-grp>${g.name ? `<h3>${g.name}</h3>` : ""}<dl>${g.items.map(rowHTML).join("")}</dl></div>`;
      }
    }
    html += `</section>`;
    chips.insertAdjacentHTML("beforeend", `<a href="#${s.id}">${s.title}</a>`);
  }
  main.innerHTML = html + `<p class="empty" id="empty" hidden>검색 결과가 없습니다. 다른 단어로 찾아보세요.</p>`;
  for (const el of main.querySelectorAll(".row, .row-t")) el.dataset.text = el.textContent.toLowerCase();
}
render();

const q = document.getElementById("q");
const count = document.getElementById("count");
const total = main.querySelectorAll(".row, .row-t").length;
function filter() {
  const t = q.value.trim().toLowerCase();
  let shown = 0;
  for (const r of main.querySelectorAll(".row, .row-t")) {
    const ok = !t || r.dataset.text.includes(t);
    r.hidden = !ok; if (ok) shown++;
  }
  for (const g of main.querySelectorAll("[data-grp]")) g.hidden = !g.querySelector(".row:not([hidden])");
  for (const s of main.querySelectorAll("[data-sec]")) s.hidden = !s.querySelector(".row:not([hidden]), .row-t:not([hidden])");
  document.getElementById("empty").hidden = shown > 0;
  count.textContent = t ? `${shown} / ${total}개` : `전체 ${total}개`;
}
q.addEventListener("input", filter);
filter();

const hideBtn = document.getElementById("hideBtn");
function setHide(on) {
  document.body.classList.toggle("hide", on);
  hideBtn.setAttribute("aria-pressed", String(on));
  for (const d of main.querySelectorAll(".shown")) d.classList.remove("shown");
  try { localStorage.setItem("sla-hide", on ? "1" : "0"); } catch (e) {}
}
hideBtn.addEventListener("click", () => setHide(!document.body.classList.contains("hide")));
document.getElementById("revealBtn").addEventListener("click", () => {
  for (const d of main.querySelectorAll("dd, td.ans")) d.classList.add("shown");
});
main.addEventListener("click", e => {
  const d = e.target.closest("dd, td.ans");
  if (d && document.body.classList.contains("hide")) d.classList.toggle("shown");
});
try { if (localStorage.getItem("sla-hide") === "1") setHide(true); } catch (e) {}
</script>
